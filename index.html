      document.onkeydown = function(e) {
        if (e.key === 'F12' || e.keyCode === 123) return false;
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) return false;
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) return false;

        if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) return false;

      const createLessonPlanSchema = (numSessions) => ({
        type: "OBJECT",
        properties: {
          lessonName: { type: "STRING" },
          competency: { type: "STRING" },
          objectives: { type: "ARRAY", items: { type: "STRING" }, description: `Exactly ${numSessions} items.` },

        const [formData, setFormData] = useState({

          gradeSection: '',

        const fileInputRef = useRef(null);

        const [isRefining, setIsRefining] = useState(false);

        // Futuristic UI Drawer State
        const [isSidebarOpen, setIsSidebarOpen] = useState(true);
        const [isMobile, setIsMobile] = useState(false);

        useEffect(() => {
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');

            document.documentElement.classList.remove('dark');
          }
        }, [theme]);

        const toggleTheme = () => {
          setTheme(prev => prev === 'dark' ? 'light' : 'dark');
        };

        useEffect(() => {
          const handleResize = () => {
            const mobile = window.innerWidth < 1024;
            setIsMobile(mobile);
            if (mobile) setIsSidebarOpen(false);
            else setIsSidebarOpen(true);
          };
          handleResize();
          window.addEventListener('resize', handleResize);
          return () => window.removeEventListener('resize', handleResize);
        }, []);

        const handleInputChange = (e) => {
          const { name, value } = e.target;
          setFormData(prev => ({
            ...prev,
            [name]: name === 'numSessions' ? parseInt(value, 10) : value
          }));
        };

        const toggleSubjectTag = (subjectTag) => {
          setFormData(prev => {
            const currentList = prev.integrationSubjects
              ? prev.integrationSubjects.split(',').map(s => s.trim()).filter(Boolean)
              : [];
            
            let updatedList;
            if (currentList.some(s => s.toLowerCase() === subjectTag.toLowerCase())) {
              updatedList = currentList.filter(s => s.toLowerCase() !== subjectTag.toLowerCase());
            } else {
              updatedList = [...currentList, subjectTag];
            }
            return { ...prev, integrationSubjects: updatedList.join(', ') };
          });
        };

        const handleFileChange = (e) => {
          const selectedFile = e.target.files[0];
          if (selectedFile) {
            const validTypes = ['.doc', '.docx', '.pdf'];
            const ext = selectedFile.name.substring(selectedFile.name.lastIndexOf('.')).toLowerCase();
            if (validTypes.includes(ext)) {
              setFile(selectedFile);
            } else {
              alert('File type error: Please upload .doc, .docx, or .pdf format.');
            }
          }
        };

        const handleRefine = async () => {
          if (!refinementPrompt.trim() || !generatedData) return;
          setIsRefining(true);
          setError(null);
          
          try {
            const currentSessions = formData.numSessions || 5;
            const schema = createLessonPlanSchema(currentSessions);
            
            const systemPrompt = `You are a futuristic DepEd AI Educational Controller in the Philippines.
  Update the current ${currentSessions}-session Weekly Lesson Plan (Lesson Exemplar) JSON according to user refinement guidelines while maintaining strict DepEd curriculum compliance.
  Pedagogical AI Strategy to incorporate: ${formData.pedagogicalStrategy}
  Specific Opportunities for Integration Subjects to maintain/enrich: ${formData.integrationSubjects}
  Language: ${formData.language}`;

            const userPrompt = `Current JSON Plan:
  ${JSON.stringify(generatedData)}

  Refinement Order: "${refinementPrompt}"
  Return the ENTIRE modified JSON object matching schema with exactly ${currentSessions} session elements per array. For "opportunities", explicitly name integration subjects.`;

            const payload = {
              contents: [{ role: "user", parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: schema
              }
            };

            const apiKey = ""; // Consider moving this to a secure backend
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
              setGeneratedData(JSON.parse(result.candidates[0].content.parts[0].text));
              setRefinementPrompt('');
            } else {
              throw new Error("Refinement response corrupted.");
            }
          } catch (err) {
            console.error("Refine Error:", err);
            setError("Cyber Refine Engine Encountered an Anomaly.");
          } finally {
            setIsRefining(false);
          }
        };

        const handleGenerate = async () => {
          setStatus('generating');
          setError(null);

          const count = formData.numSessions || 5;
          const schema = createLessonPlanSchema(count);

          try {
            let payloadContents = [];
            let systemPrompt = `You are a high-level DepEd AI Educational Architect.
  Synthesize a detailed ${count}-session Weekly Lesson Plan (Lesson Exemplar) in strict JSON format.

  PEDAGOGICAL STRATEGY TO EMBED: "${formData.pedagogicalStrategy}"
  CROSS-CURRICULAR SUBJECTS TO INTEGRATE IN "OPPORTUNITIES FOR INTEGRATION": "${formData.integrationSubjects}"

  RULES:
  1. Generate complete ${count}-session matrix structure. Each array property (objectives, preLesson, flow, resources, opportunities, formativeAssessment, extendedLearning) MUST contain exactly ${count} items corresponding to Session 1 through Session ${count}.
  2. Learning Experience (Flow): Provide precise, step-by-step instructional procedures for each session adhering to ${formData.pedagogicalStrategy}.
  3. Opportunities for Integration: Explicitly specify cross-curricular subject integrations for EACH session by explicitly naming specific subjects (e.g., EsP / Values Education, Science, Mathematics, Araling Panlipunan, MAPEH, ICT, Health, Peace Education, Gender and Development / GAD) and detailing how they directly relate to that session's lesson content.

  Target Language: ${formData.language}
  Subject: ${formData.subject || 'General Education'}`;

            let tools = undefined;

            // Automatically derive effective competency if field is empty
            const effectiveCompetency = formData.competency.trim() || 
              (formData.subject.trim() 
                ? `Demonstrate understanding and master core competencies in ${formData.subject}.` 
                : "Demonstrate understanding of key curriculum principles and apply critical problem-solving strategies.");

            if (file) {
              const base64Data = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
              });

              let mimeType = file.type || 'application/octet-stream';
              if (file.name.endsWith('.pdf')) mimeType = 'application/pdf';
              else if (file.name.endsWith('.docx')) mimeType = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
              else if (file.name.endsWith('.doc')) mimeType = 'application/msword';

              systemPrompt += `\nUse the reference document content as the key blueprint foundation.`;

              payloadContents = [{
                role: "user",
                parts: [
                  { text: `Synthesize ${count}-session lesson matrix for Grade ${formData.gradeSection || 'Level'}, Term ${formData.termWeek || '1'}. Competency: "${effectiveCompetency}". Integrate subjects: "${formData.integrationSubjects}"` },
                  { inlineData: { mimeType, data: base64Data } }
                ]
              }];
            } else {
              systemPrompt += `\nUnpack competency into ${count} specific session objectives and utilize search tools to match DepEd LR portal standards.`;
              tools = [{ "google_search": {} }];

              payloadContents = [{
                role: "user",
                parts: [{ text: `Generate ${count}-session plan for Grade ${formData.gradeSection || 'Level'}, Term ${formData.termWeek || '1'} with competency: "${effectiveCompetency}". Specifically integrate subjects: "${formData.integrationSubjects}".` }]
              }];
            }

            const payload = {
              contents: payloadContents,
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: schema
              }
            };

            if (tools) payload.tools = tools;

            const apiKey = "";  // Consider moving this to a secure backend
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
              setGeneratedData(JSON.parse(result.candidates[0].content.parts[0].text));
              setStatus('done');
            } else {

              preLesson: makeArray(i => `Diagnostic warm-up and concept review for Session ${i}.`),
              flow: makeArray(i => `1. Direct Instruction (15m): Present Session ${i} concepts.\n2. Guided Practice (20m): Solve exercises.\n3. Independent Task (10m): Complete worksheet.\n4. Synthesis (5m): Exit ticket review.`),
              resources: makeArray(i => `DepEd LR Guide, slide deck, projector, Session ${i} worksheets.`),
              opportunities: makeArray(i => `• Edukasyon sa Pagpapakatao (EsP): Practice intellectual honesty, accountability, and ethical reasoning during Session ${i}.\n• Science & ICT: Apply analytical methods and utilize digital tools for verifying information.\n• Peace Education & GAD: Promote inclusive collaboration and respectful communication during group exercises.`),
              formativeAssessment: makeArray(i => `1. Session ${i} Question 1?\nA) Option A\nB) Option B\nC) Option C\nD) Option D\n\n2. Session ${i} Question 2?\nA) Option A\nB) Option B\nC) Option C\nD) Option D\n\n3. Session ${i} Question 3?\nA) Option A\nB) Option B\nC) Option C\nD) Option D\n\n4. Session ${i} Question 4?\nA) Option A\nB) Option B\nC) Option C\nD) Option D\n\n5. Session ${i} Question 5?\nA) Option A\nB) Option B\nC) Option C\nD) Option D`),
              extendedLearning: makeArray(i => `Session ${i} extended application activity and DepEd portal study module.`)
            });
            setError("Generated structured lesson plan template based on standard DepEd requirements.");
            setStatus('done');
          }
        };

        const exportToWord = async () => {

            const totalCols = numCols + 1;

            const tr = (text, options = {}) => new TextRun({ text: typeof text === 'string' ? text : String(text || " "), size: 22, ...options });
            const pg = (children, options = {}) => new Paragraph({ children, ...options });

            const safeN = (arr) => {
              const res = Array.isArray(arr) ? [...arr] : [];
              while (res.length < numCols) res.push(" ");

                paragraphs = safeText.split('\n').map(line => pg([tr(line, { bold: options.bold, italic: options.italic })], { alignment: options.alignment || "left" }));
              }
              return new TableCell({
                columnSpan: colSpan,
                shading: options.bg ? { fill: options.bg } : undefined,
                verticalAlign: "top",
                margins: { top: 113, bottom: 113, left: 113, right: 113 },
                children: paragraphs.length ? paragraphs : [pg([tr(" ")])]
              });
            };

            const complexCell = (paragraphs, colSpan = 1, bg = undefined) => new TableCell({
              columnSpan: colSpan,
              shading: bg ? { fill: bg } : undefined,
              verticalAlign: "top",

                new TableRow({ children: [createCell("Learner Context:", 1, { bold: true }), createCell(generatedData.learnerContext, numCols)] }),

                  ]

                new TableRow({ children: [createCell("Flow:", 1, { bold: true }), ...safeN(generatedData.flow).map(item => createCell(item))] }),
                new TableRow({ children: [createCell("Learning Resources:", 1, { bold: true }), ...safeN(generatedData.resources).map(item => createCell(item))] }),

                new TableRow({

                    ]))
                  ]
                }),
                new TableRow({

                    complexCell([

                })

                children: [table],
              }]
            });

            const blob = await Packer.toBlob(doc);
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `CYBER_DLL_${formData.subject || 'Exemplar'}_${numCols}Sessions_Grade${formData.gradeSection || 'Level'}.docx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          } catch (err) {
            console.error("Export Error:", err);
            alert(`Export failed: ${err.message}`);

          }
        };

        const CyberInputLabel = ({ children }) => (
          <label className={`block text-[11px] font-orbitron uppercase tracking-widest ${theme === 'dark' ? 'text-[#00ff88]' : 'text-emerald-700'} mb-1.5 flex items-center gap-1.5 font-bold`}>

          ? (generatedData.objectives ? generatedData.objectives.length : formData.numSessions)

                              Artificial Intelligence (AI) tools were used to assist in the preparation of this lesson plan, particularly in generating ideas, improving clarity of instructions, and organizing learning activities aligned with the MELCs. All AI-assisted outputs were carefully reviewed, validated, and contextualized by the teacher to ensure accuracy, appropriateness, and alignment with DepEd standards.

                          <tr>
                            <td className="border border-black p-2 font-bold">Learning Competency</td>

                            <td className="border border-black p-2 font-bold">Learning Objectives</td>
                            {(generatedData.objectives || []).slice(0, numCols).map((obj, i) => <td key={i} className="border border-black p-2">{obj}</td>)}
                          </tr>

                          <tr>
                            <td className="border border-black p-2 font-bold">Learner Context</td>

      }

      function GatekeeperApp() {
        const [appStatus, setAppStatus] = useState('initializing'); // initializing, locked, pending, approved, admin_login, admin_dashboard
        const [userName, setUserName] = useState('');
        const [userId, setUserId] = useState(null);
        const [adminPasscode, setAdminPasscode] = useState('');
        const [requests, setRequests] = useState([]);
        const [fbRefs, setFbRefs] = useState(null);
        const [gatekeeperError, setGatekeeperError] = useState(null); // Added error state for troubleshooting

        useEffect(() => {
          const initAuth = async () => {
            if (!window.FB_MODULES) {
              console.warn("Firebase modules not loaded. Bypassing gatekeeper.");
              setAppStatus('approved');
              return;
            }
            try {
              const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, onSnapshot } = window.FB_MODULES;
              const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
              const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-ilaw-app';

              if (!config) {
                console.warn("No Firebase config found. Bypassing gatekeeper.");
                setAppStatus('approved');
                return;
              }

              const app = initializeApp(config);
              const auth = getAuth(app);
              const db = getFirestore(app);
              setFbRefs({ db, appId });

              const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
              if (token) {
                await signInWithCustomToken(auth, token);
              } else {
                await signInAnonymously(auth);
              }

              const uid = auth.currentUser.uid;
              setUserId(uid);

              // Listen to user's access status
              const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'access_requests', uid);
              onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                  const data = docSnap.data();
                  if (data.status === 'approved') {
                    setAppStatus('approved');
                  } else if (appStatus !== 'admin_login' && appStatus !== 'admin_dashboard') {
                    setAppStatus('pending');
                  }
                } else if (appStatus !== 'admin_login' && appStatus !== 'admin_dashboard') {
                  setAppStatus('locked');
                }
              }, (err) => {
                console.error("Gatekeeper error:", err);
                setAppStatus('locked');
              });

            } catch (error) {
              console.error("Firebase init failed", error);
              setAppStatus('locked'); // Fail-closed for security
            }
          };
          initAuth();
        }, []);

        const handleRequestAccess = async () => {
          if (!userName.trim() || !fbRefs || !userId) return;
          const { setDoc, doc } = window.FB_MODULES;
          setGatekeeperError(null);
          try {
            const userDocRef = doc(fbRefs.db, 'artifacts', fbRefs.appId, 'public', 'data', 'access_requests', userId);
            await setDoc(userDocRef, {
              name: userName,
              status: 'pending',
              timestamp: new Date().toISOString()
            });
            setAppStatus('pending');
          } catch(e) {
            console.error("Failed to request access:", e);
            setGatekeeperError("Failed to submit request. Check network or permissions.");
          }
        };

        const handleAdminLogin = () => {
          if (adminPasscode === 'ILAW-ADMIN-2026') {
            setAppStatus('admin_dashboard');
            setGatekeeperError(null);
          } else {
            setAdminPasscode('ACCESS DENIED');
            setTimeout(() => setAdminPasscode(''), 1500);
          }
        };

        // REAL-TIME DASHBOARD LISTENER
        useEffect(() => {
          let unsubscribe = () => {};
          if (appStatus === 'admin_dashboard' && fbRefs) {
            const { collection, onSnapshot } = window.FB_MODULES;
            const reqCol = collection(fbRefs.db, 'artifacts', fbRefs.appId, 'public', 'data', 'access_requests');
            
            unsubscribe = onSnapshot(reqCol, (snap) => {
              const reqs = [];
              snap.forEach(d => reqs.push({ id: d.id, ...d.data() }));
              // Sort by newest first
              reqs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
              setRequests(reqs);
            }, (err) => {
              console.error("Real-time fetch error:", err);
              setGatekeeperError("Error monitoring requests. Connection lost or access denied.");
            });
          }
          return () => unsubscribe();
        }, [appStatus, fbRefs]);

        const handleAdminAction = async (id, newStatus) => {
          if (!fbRefs) return;
          setGatekeeperError(null);
          try {
            const { updateDoc, doc } = window.FB_MODULES;
            const userDocRef = doc(fbRefs.db, 'artifacts', fbRefs.appId, 'public', 'data', 'access_requests', id);
            await updateDoc(userDocRef, { status: newStatus });
          } catch (e) {
            console.error("Failed to update status:", e);
            setGatekeeperError("Action failed. Permission denied.");
          }
        };

        // Pass-through to original app if approved
        if (appStatus === 'approved') {
          return <MainApp />;
        }

        // Gatekeeper Screens
        return (
          <div className="relative min-h-screen w-full bg-[#050811] text-slate-100 font-rajdhani flex items-center justify-center overflow-hidden">
            <FuturisticBackground />
            
            <div className="relative z-10 w-full max-w-md p-8 border border-[#00ff88]/30 bg-[#0a0f1d]/90 backdrop-blur-xl rounded-2xl shadow-[0_0_50px_rgba(0,255,136,0.15)] flex flex-col items-center text-center">
              
              {gatekeeperError && (
                <div className="absolute -top-12 w-full p-2 bg-red-950/90 border border-red-500/50 text-red-300 text-xs rounded-lg font-semibold animate-pulse z-50 shadow-[0_0_20px_rgba(239,68,68,0.3)]">
                  ⚠️ {gatekeeperError}
                </div>
              )}

              {/* Hidden Admin Trigger */}
              <button 
                onClick={() => setAppStatus(prev => prev === 'admin_login' ? 'locked' : 'admin_login')}
                className="absolute top-4 right-4 text-slate-600 hover:text-[#00ff88] transition-colors"
                title="Admin Access"
              >
                <LockIcon className="w-5 h-5" />
              </button>

              {appStatus === 'initializing' && (
                <>
                  <LoaderIcon className="w-12 h-12 text-[#00ff88] mb-4 animate-spin" />
                  <h2 className="text-xl font-orbitron font-bold tracking-widest text-white">VERIFYING CLEARANCE</h2>
                </>
              )}

              {appStatus === 'locked' && (
                <>
                  <ShieldIcon className="w-16 h-16 text-red-500 mb-4 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]" />
                  <h2 className="text-2xl font-orbitron font-bold tracking-widest text-red-500 mb-2">SYSTEM LOCKED</h2>
                  <p className="text-slate-400 text-sm mb-6">Unauthorized access detected. You must request clearance from the System Administrator to utilize the ILAW Cyber-Engine.</p>
                  
                  <div className="w-full space-y-4">
                    <div>
                      <label className="block text-left text-[11px] font-orbitron uppercase tracking-widest text-[#00ff88] mb-1.5 font-bold">IDENTIFICATION (YOUR NAME)</label>
                      <input 
                        type="text" 
                        value={userName}
                        onChange={(e) => setUserName(e.target.value)}
                        placeholder="Enter your name..." 
                        className="w-full bg-[#050811] border border-[#00ff88]/40 focus:border-[#00ff88] text-white rounded-lg p-3 outline-none text-sm font-semibold"
                      />
                    </div>
                    <button 
                      onClick={handleRequestAccess}
                      className="w-full bg-[#00ff88]/10 hover:bg-[#00ff88]/20 border border-[#00ff88] text-[#00ff88] font-orbitron font-bold py-3 rounded-lg transition-all shadow-[0_0_15px_rgba(0,255,136,0.2)]"
                    >
                      REQUEST ACCESS CLEARANCE
                    </button>
                  </div>
                </>
              )}

              {appStatus === 'pending' && (
                <>
                  <div className="relative mb-6">
                    <div className="w-16 h-16 border-4 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
                    <LockIcon className="w-6 h-6 text-amber-500 absolute inset-0 m-auto" />
                  </div>
                  <h2 className="text-2xl font-orbitron font-bold tracking-widest text-amber-500 mb-2">CLEARANCE PENDING</h2>
                  <p className="text-slate-300 text-sm mb-4">Your access request has been submitted to the secure network.</p>
                  <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-lg text-left">
                    <p className="text-amber-200 text-xs font-semibold">
                      <span className="text-amber-500">ACTION REQUIRED:</span> Please notify the System Administrator directly (via message or email) that you have requested access. This screen will automatically unlock once you are approved.
                    </p>
                  </div>
                </>
              )}

              {appStatus === 'admin_login' && (
                <>
                  <CpuIcon className="w-16 h-16 text-[#00f0ff] mb-4 drop-shadow-[0_0_15px_rgba(0,240,255,0.5)]" />
                  <h2 className="text-2xl font-orbitron font-bold tracking-widest text-[#00f0ff] mb-2">ADMIN OVERRIDE</h2>
                  <p className="text-slate-400 text-sm mb-6">Enter master passcode to access the clearance dashboard.</p>
                  
                  <div className="w-full space-y-4">
                    <input 
                      type="password" 
                      value={adminPasscode}
                      onChange={(e) => setAdminPasscode(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleAdminLogin()}
                      placeholder="Enter Passcode..." 
                      className="w-full bg-[#050811] border border-[#00f0ff]/40 focus:border-[#00f0ff] text-white rounded-lg p-3 outline-none text-center tracking-widest font-bold"
                    />
                    <button 
                      onClick={handleAdminLogin}
                      className="w-full bg-[#00f0ff] text-black font-orbitron font-bold py-3 rounded-lg transition-all shadow-[0_0_15px_rgba(0,240,255,0.4)]"
                    >
                      AUTHENTICATE
                    </button>
                    <button 
                      onClick={() => setAppStatus('locked')}
                      className="text-slate-500 text-xs font-bold hover:text-white"
                    >
                      CANCEL
                    </button>
                  </div>
                </>
              )}

              {appStatus === 'admin_dashboard' && (
                <div className="w-full flex flex-col h-[60vh]">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-lg font-orbitron font-bold tracking-widest text-[#00ff88] flex items-center gap-2">
                      CLEARANCE LOGS
                      <span className="flex items-center gap-1 text-[10px] bg-[#00ff88]/10 border border-[#00ff88]/40 px-2 py-0.5 rounded-full text-[#00ff88]">
                        <span className="w-1.5 h-1.5 bg-[#00ff88] rounded-full animate-ping inline-block"></span>
                        LIVE
                      </span>
                    </h2>
                    <button onClick={() => setAppStatus('locked')} className="text-red-400 text-xs font-bold border border-red-500/50 px-3 py-1 rounded hover:bg-red-500/10 transition-colors">EXIT ADMIN</button>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar text-left">
                    {requests.length === 0 && <p className="text-slate-500 text-sm text-center italic mt-10">No clearance requests found.</p>}
                    
                    {requests.map((req) => (
                      <div key={req.id} className={`p-3 border rounded-lg ${req.status === 'approved' ? 'border-[#00ff88]/30 bg-[#00ff88]/5' : req.status === 'denied' ? 'border-red-500/30 bg-red-500/5' : 'border-amber-500/30 bg-amber-500/5'}`}>
                        <div className="flex justify-between items-start mb-2">
                          <div>
                            <p className="font-bold text-white text-sm">{req.name}</p>
                            <p className="text-[10px] text-slate-500">{new Date(req.timestamp).toLocaleString()}</p>
                          </div>
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase ${req.status === 'approved' ? 'bg-[#00ff88] text-black' : req.status === 'denied' ? 'bg-red-500 text-white' : 'bg-amber-500 text-black'}`}>
                            {req.status}
                          </span>
                        </div>
                        <div className="flex gap-2 mt-3">
                          {req.status !== 'approved' && (
                            <button onClick={() => handleAdminAction(req.id, 'approved')} className="flex-1 bg-[#00ff88]/20 text-[#00ff88] border border-[#00ff88]/50 text-xs py-1 rounded hover:bg-[#00ff88] hover:text-black transition-colors font-bold">
                              APPROVE
                            </button>
                          )}
                          {req.status === 'approved' && (
                            <button onClick={() => handleAdminAction(req.id, 'denied')} className="flex-1 bg-slate-800 text-slate-400 border border-slate-700 text-xs py-1 rounded hover:bg-red-500 hover:text-white transition-colors font-bold">
                              REVOKE
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<GatekeeperApp />);
    </script>
  </body>
  </html>
